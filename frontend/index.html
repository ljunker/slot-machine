<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- nginx (SSI) setzt hier Titel und Open-Graph-Tags der Seite ein; ohne SSI gilt der Standardtitel. -->
    <!--# block name="meta_fallback" --><title>Event Scheduler</title><!--# endblock -->
    <!--# include virtual="/api/public/meta$request_uri" stub="meta_fallback" -->
    <script>
      try {
        const choice = localStorage.getItem('slot-machine-theme')
        document.documentElement.dataset.theme = choice === 'dark' || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'
      } catch {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
